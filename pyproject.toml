[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-commander"
version = "0.1.0"
description = "CLI-first autonomous SRE investigation agent for learning agent harness engineering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2,<1.0",
]

[project.scripts]
incident-commander = "incident_commander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
